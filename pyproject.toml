[project]
name = "ramachandran"
version = "0.1.0"
description = "A web-based Ramachandran plot analysis and visualization tool for protein structures."
readme = "README.md"
authors = [
    { name = "Karl Gruber", email = "gammaturn@gmail.com" }
]
license = { text = "MIT" }
keywords = ["bioinformatics", "protein-structure", "ramachandran-plot", "pdb", "mmcif"]
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.86",
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
