<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramachandran Explorer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Plotly JS -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="main-container">
        <header>
            <h1>Ramachandran <span class="accent">Explorer</span></h1>
        </header>

        <section class="upload-section glass">
            <div class="input-group">
                <input type="text" id="pdb-id" placeholder="Enter PDB ID (e.g. 1UBQ)" autocomplete="off">
                <span class="or">OR</span>
                <div class="file-input-wrapper">
                    <button class="btn btn-secondary">Upload PDB/mmCIF</button>
                    <input type="file" id="pdb-file" accept=".pdb,.cif,.mmcif">
                </div>
                <button id="analyze-btn" class="btn btn-primary">Analyze</button>
            </div>
        </section>

        <main id="results-section" class="results-container hidden">
            <div class="plot-controls-grid">
                <div class="panel glass stats-panel">
                    <h3 class="summary-header">
                        <div class="pdb-title">Summary for <span id="display-pdb-id">-</span></div>
                        <div id="display-filter-info" class="filter-subtitle">All Residues</div>
                    </h3>
                    <div class="stats-grid">
                        <div class="stats-header-row">
                            <span></span>
                            <span class="header-label">Selection</span>
                            <span class="header-label">Overall</span>
                        </div>

                        <div class="stats-row">
                            <span class="label">Favoured</span>
                            <span class="value-group">
                                <span id="favoured-count" class="value text-success">-</span>
                                <span id="favoured-percent" class="percent">(-%)</span>
                            </span>
                            <span class="value-group">
                                <span id="overall-favoured-count" class="value text-success">-</span>
                                <span id="overall-favoured-percent" class="percent">(-%)</span>
                            </span>
                        </div>

                        <div class="stats-row">
                            <span class="label">Allowed</span>
                            <span class="value-group">
                                <span id="allowed-count" class="value text-warning">-</span>
                                <span id="allowed-percent" class="percent">(-%)</span>
                            </span>
                            <span class="value-group">
                                <span id="overall-allowed-count" class="value text-warning">-</span>
                                <span id="overall-allowed-percent" class="percent">(-%)</span>
                            </span>
                        </div>

                        <div class="stats-row">
                            <span class="label">Outliers</span>
                            <span class="value-group">
                                <span id="outlier-count" class="value text-danger">-</span>
                                <span id="outlier-percent" class="percent">(-%)</span>
                            </span>
                            <span class="value-group">
                                <span id="overall-outlier-count" class="value text-danger">-</span>
                                <span id="overall-outlier-percent" class="percent">(-%)</span>
                            </span>
                        </div>
                    </div>

                    <div class="filter-group">
                        <h4>Filter by Type</h4>
                        <div id="type-filters" class="chips-container">
                            <!-- Type chips will be generated here -->
                        </div>
                    </div>

                    <div class="filter-group">
                        <h4>Filter by Chain</h4>
                        <div id="chain-filters" class="chips-container">
                            <!-- Chain chips will be generated here -->
                        </div>
                    </div>

                    <div class="panel-actions">
                        <button id="write-csv-btn" class="btn btn-secondary">Report CSV</button>
                        <button id="download-pdf-btn" class="btn btn-secondary">Report PDF</button>
                    </div>
                </div>

                <div class="panel glass plot-panel">
                    <div id="rama-plot-container"></div>
                </div>
            </div>
        </main>

        <div id="loading" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>Analyzing Structure...</p>
        </div>
    </div>

    <footer>
        <p>Built with Flask & Plotly | Reference data from <a href="https://github.com/rlabduke/reference_data" target="_blank" rel="noopener noreferrer">Top8000</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/plot.js') }}"></script>
</body>

</html>
